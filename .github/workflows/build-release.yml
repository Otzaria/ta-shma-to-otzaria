name: Build biographies release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Download previous data hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern biographies.sha256 --output previous.sha256 \
            || echo "no-previous-release" > previous.sha256

      - name: Build biographies file
        env:
          TASHMA_API_KEY: ${{ secrets.KEY }}
          OBF_KEY: ${{ secrets.OBF_KEY }}
        run: python scripts/build_biographies.py

      - name: Create release if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(cat out/biographies.sha256)
          old=$(cat previous.sha256)
          if [ "$new" = "$old" ]; then
            echo "Data unchanged (hash $new) — no release."
            exit 0
          fi
          tag="bio-$(date -u +%Y%m%d-%H%M%S)"
          echo "Data changed: $old -> $new. Creating release $tag"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Biographies $tag" \
            --notes "Automated biographies build. Data SHA-256: \`$new\`" \
            out/biographies.tsb out/biographies.sha256
