name: API permission probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate endpoints
        env:
          API_KEY: ${{ secrets.KEY }}
        run: |
          set +e
          probe() {
            local url="https://api.tashma.co.il$1"
            body=$(curl -sS -m 20 -w '\n%{http_code}' -H "x-api-key: $API_KEY" "$url")
            status=$(printf '%s' "$body" | tail -n1)
            content=$(printf '%s' "$body" | sed '$d' | head -c 300)
            len=$(printf '%s' "$body" | sed '$d' | wc -c)
            echo "[$status] $1  (len=$len)"
            echo "    $content"
          }
          for p in \
            /api/books /api/books/ /api/book /api/sefarim /api/seforim /api/sfarim \
            /api/otzaria /api/otzaria/books /api/library /api/files /api/downloads \
            /api/texts /api/documents /api/updates /api/releases /api/export \
            /api/rabanan/updates /api/rabanan/version /api/rabanan/last-modified \
            /api/version /api/status /api/me /api/scopes /api/keys/me ; do
            probe "$p"
          done
          echo "--- HEAD request to check caching headers on rabanan list ---"
          curl -sSI -H "x-api-key: $API_KEY" https://api.tashma.co.il/api/rabanan/ | head -30
