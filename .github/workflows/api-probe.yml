name: API permission probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Tashma API endpoints
        env:
          API_KEY: ${{ secrets.KEY }}
        run: |
          set +e
          probe() {
            local label="$1" url="$2"
            echo "=== $label ==="
            echo "URL: $url"
            body=$(curl -sS -w '\n%{http_code}' -H "x-api-key: $API_KEY" "$url")
            status=$(echo "$body" | tail -n1)
            content=$(echo "$body" | sed '$d')
            echo "HTTP status: $status"
            echo "Body (first 500 chars):"
            echo "$content" | head -c 500
            echo
            echo "Body length: $(echo -n "$content" | wc -c) bytes"
            echo
          }
          echo "Key present: $([ -n "$API_KEY" ] && echo yes || echo NO)"
          echo "Key length: ${#API_KEY}"
          echo
          probe "List all rabanan"        "https://api.tashma.co.il/api/rabanan/"
          probe "Single rav (id 1)"       "https://api.tashma.co.il/api/rabanan/1"
          probe "Calendar dates"          "https://api.tashma.co.il/api/rabanan/calendar-dates"
          probe "Undocumented root"       "https://api.tashma.co.il/api/"
          probe "No-key control"          "https://api.tashma.co.il/api/rabanan/"
          echo "=== No-key control (without header) ==="
          curl -sS -o /dev/null -w 'HTTP status without key: %{http_code}\n' "https://api.tashma.co.il/api/rabanan/"
