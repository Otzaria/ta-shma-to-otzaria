name: API permission probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download one file with long timeout
        env:
          API_KEY: ${{ secrets.KEY }}
        run: |
          set +e
          SN=19102
          ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('א טאג ביים רבין'))")
          echo "=== GET /api/files?SN=$SN&nameComonA1=<book name>, 8 min timeout ==="
          time curl -sS -m 480 -D headers.txt -o out.bin \
            -H "x-api-key: $API_KEY" \
            "https://api.tashma.co.il/api/files?SN=$SN&nameComonA1=$ENC"
          echo "curl exit: $?"
          echo "--- Response headers ---"
          cat headers.txt
          echo "--- File info ---"
          ls -la out.bin
          file out.bin
          echo "--- First 800 bytes ---"
          head -c 800 out.bin; echo
          echo "--- If JSON, keys ---"
          jq 'if type=="object" then keys elif type=="array" then [length, (.[0]|keys?)] else type end' out.bin 2>/dev/null || echo "(not json)"
